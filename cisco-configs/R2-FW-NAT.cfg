
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2-FW-NAT
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
redundancy
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface GigabitEthernet0/0
 ip address 172.16.10.2 255.255.255.252
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 ip address 172.16.20.1 255.255.255.252
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 2.2.2.2
!
ip forward-protocol nd
!
!
ip ftp username eleven
ip ftp password Cisco123!
no ip http server
no ip http secure-server
ip tftp source-interface GigabitEthernet0/1
ip tftp blocksize 8192
!
ip access-list extended LAB_FIREWALL_ACL
 permit ospf any any
 permit icmp any any
 permit udp any any eq bootps
 permit udp any any eq bootpc
 permit udp any host 10.100.100.10 eq tftp
 permit udp any host 172.16.10.1 eq tftp
 permit udp host 10.100.100.10 gt 1023 any
 permit udp host 172.16.10.1 gt 1023 any
 permit udp any gt 1023 host 10.100.100.10 gt 1023
 permit udp any gt 1023 host 172.16.10.1 gt 1023
 permit tcp any host 10.100.200.20 eq ftp
 permit tcp any host 10.100.200.20 eq ftp-data
 permit tcp any host 10.100.200.20 range 40000 40100
 permit tcp host 10.100.200.20 any established
 permit tcp host 10.100.200.20 eq ftp-data any
 permit tcp any host 10.100.200.20 eq 22
 permit tcp any host 10.100.200.20 eq telnet
 permit tcp any host 10.100.100.10 eq telnet
 deny   ip any any log
!
ipv6 ioam timestamp
!
!
!
control-plane
!
line con 0
line aux 0
line vty 0 4
 login
 transport input none
!
no scheduler allocate
!
end