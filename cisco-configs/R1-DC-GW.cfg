!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R1-DC-GW
!
boot-start-marker
boot-end-marker
!
!
!
aaa new-model
!
!
aaa authentication login default local
aaa authorization exec default local 
!
!
!
!
!
aaa session-id common
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
ip domain name eleven.local
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
username scp privilege 15 secret 9 $9$XLYErgfs793Tev$IMe2SQL7eyn9bew5StgnA.9fi5XZTNsy2I54jqynZ52
!
redundancy
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/0.100
 encapsulation dot1Q 100
 ip address 10.100.100.1 255.255.255.0
 ip ospf 1 area 0
!
interface GigabitEthernet0/0.200
 encapsulation dot1Q 200
 ip address 10.100.200.1 255.255.255.0
 ip ospf 1 area 0
!
interface GigabitEthernet0/1
 ip address 172.16.10.1 255.255.255.252
 ip ospf 1 area 0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 1.1.1.1
 passive-interface GigabitEthernet0/0.100
 passive-interface GigabitEthernet0/0.200
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip ssh version 2
ip scp server enable
!
ipv6 ioam timestamp
!
!
tftp-server flash:boot/grub/grub.cfg
!
!
!
control-plane

!
line con 0
line aux 0
line vty 0 4
 transport input ssh
!
no scheduler allocate
!
end