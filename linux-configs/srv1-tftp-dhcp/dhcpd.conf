default-lease-time 3600;
max-lease-time 7200;
authoritative;
option tftp-server-address code 150 = ip-address;

subnet 10.100.100.0 netmask 255.255.255.0 {
}
subnet 172.16.40.0 netmask 255.255.255.252 {
  range 172.16.40.2 172.16.40.2;
  option routers 172.16.40.1;
  option subnet-mask 255.255.255.252;
  next-server 10.100.100.10;
  option tftp-server-name "10.100.100.10";
  option tftp-server-address 10.100.100.10;
  option bootfile-name "ztp/r5-confg";
}